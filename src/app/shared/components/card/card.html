<div class="card">
  <div class="card-header">
    <span class="card-title">{{ title }}</span>
  </div>

  <div class="card-body">
    <ng-container *ngIf="pipe === 'currency'; else normal">
      <span class="card-value">{{ value | currency }}</span>
    </ng-container>

    <ng-template #normal>
      <span class="card-value">{{ value }}</span>
    </ng-template>
  </div>
</div>
